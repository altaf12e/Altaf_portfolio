<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Portfolio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg);">

<div style="width: 100%; max-width: 420px; padding: 20px;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; box-shadow: var(--shadow);">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">⚙️</div>
            <h1 style="font-size: 1.6rem; font-weight: 700;">Admin CMS Portal</h1>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Sign in to manage projects, messages &amp; settings</p>
        </div>

        <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}">
            Invalid credentials.
        </div>
        <div class="alert alert-success" th:if="${logoutMessage != null}" th:text="${logoutMessage}">
            Logged out.
        </div>

        <form th:action="@{/admin/login}" method="post" class="contact-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" placeholder="Enter your current active password" required autocomplete="new-password" style="padding-right: 42px;">
                    <button type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 4px;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                Sign In to Dashboard &rarr;
            </button>
        </form>

        <script>
            function togglePasswordVisibility() {
                var p = document.getElementById('password');
                var btn = document.getElementById('togglePasswordBtn');
                if (p.type === 'password') {
                    p.type = 'text';
                    btn.textContent = '🙈';
                } else {
                    p.type = 'password';
                    btn.textContent = '👁️';
                }
            }
        </script>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--text-dim); text-align: center;">
            <p style="margin: 0 0 10px 0; color: var(--text-muted);">🔒 Authorized administrative access only.</p>
            <p style="margin-top: 12px;"><a th:href="@{/}">&larr; Return to Public Portfolio</a></p>
        </div>
    </div>
</div>

</body>
</html>
