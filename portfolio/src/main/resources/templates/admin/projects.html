<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Manager | Portfolio CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{admin/layout :: admin-header}"></div>

<div class="admin-layout">
    <div th:replace="~{admin/layout :: admin-sidebar}"></div>

    <main class="admin-content">
        <div class="section-header">
            <div>
                <h1 class="section-title">Projects Management</h1>
                <p class="section-subtitle">Create, update, or remove portfolio projects.</p>
            </div>
            <a th:href="@{/admin/projects/new}" class="btn btn-primary btn-sm">+ Add New Project</a>
        </div>

        <div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>

        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Title &amp; Category</th>
                    <th>Tech Stack</th>
                    <th>Likes</th>
                    <th>Featured</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="project : ${projects}">
                    <td>
                        <strong th:text="${project.title}">Project Title</strong><br>
                        <span class="project-category-badge" style="font-size: 0.7rem; padding: 2px 8px;" th:text="${project.category}">Backend</span>
                    </td>
                    <td>
                        <div class="tags" style="margin-bottom: 0;">
                            <span class="tag" style="font-size: 0.72rem; padding: 2px 6px;" th:each="t : ${project.techStack}" th:text="${t}">Tech</span>
                        </div>
                    </td>
                    <td>
                        ❤️ <span th:text="${project.likesCount}">10</span>
                    </td>
                    <td>
                        <span th:if="${project.featured}" style="color: var(--success); font-weight: 700;">★ Featured</span>
                        <span th:if="${!project.featured}" style="color: var(--text-dim);">Standard</span>
                    </td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <a th:href="@{'/admin/projects/edit/' + ${project.id}}" class="btn btn-outline btn-sm">Edit</a>
                            <form th:action="@{'/admin/projects/delete/' + ${project.id}}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this project?');">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
